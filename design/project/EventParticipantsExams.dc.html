<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Participants, exams planned</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1640px; box-sizing: border-box; overflow: hidden; background: #0B0E14; color: #F4F6FA; font-family: 'Manrope', sans-serif">
<div style="display: flex; align-items: center; gap: 12px; padding: 56px 20px 0"><a href="EventDetails.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3345; background: #131823; color: #F4F6FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Participants</span><span style="margin-left: auto; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(52,211,153,0.12); color: #4ADE9F; font-size: 12px; font-weight: 700"><span style="width: 7px; height: 7px; border-radius: 4px; background: #4ADE9F"></span>Synced</span></div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 130px">
<span style="font-size: 16px; font-weight: 800; color: #A7B1C6">Winter Camp</span>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 22px; background: #131823; border: 1px solid #232B3B; color: #F4F6FA"><span style="display: flex; align-items: center; gap: 12px"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 800">5 members</span><span style="font-size: 13px; font-weight: 500; color: #A7B1C6">4 coming</span></span></span><span style="display: flex; gap: 3px; height: 10px"><span style="flex: 2; border-radius: 5px 2px 2px 5px; background: #4ADE9F"></span><span style="flex: 2; border-radius: 2px; background: #FBBF24"></span><span style="flex: 1; border-radius: 2px 5px 5px 2px; background: #3A4458"></span></span><span style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap"><span style="display: flex; align-items: center; gap: 6px"><span style="color: #4ADE9F; display: flex; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg></span><span style="font-size: 13px; font-weight: 800; color: #F4F6FA">2</span><span style="font-size: 13px; font-weight: 600; color: #A7B1C6">Paid</span></span><span style="display: flex; align-items: center; gap: 6px"><span style="color: #FBBF24; display: flex; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="font-size: 13px; font-weight: 800; color: #F4F6FA">2</span><span style="font-size: 13px; font-weight: 600; color: #A7B1C6">Attending</span></span><span style="display: flex; align-items: center; gap: 6px"><span style="color: #CBD5E1; display: flex; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></span><span style="font-size: 13px; font-weight: 800; color: #F4F6FA">1</span><span style="font-size: 13px; font-weight: 600; color: #A7B1C6">Absent</span></span></span></div>
<span style="display: flex; align-items: center; gap: 7px; padding: 0 4px; font-size: 13px; font-weight: 600; color: #A7B1C6"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg>{{ examLine }}</span>
</div>

<span style="font-size: 13px; font-weight: 500; line-height: 1.45; color: #A7B1C6">Tap a status to change it: Absent, Attending, Paid. Takes exam and order status save right away.</span>

<div style="display: flex; flex-direction: column; border-radius: 22px; background: #131823; border: 1px solid #232B3B; overflow: hidden">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="5">
<sc-if value="{{ p.notFirst }}" hint-placeholder-val="{{ false }}"><div style="height: 1px; background: #232B3B; margin: 0 16px"></div></sc-if>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 14px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(148,163,184,0.16); color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0">{{ p.initials }}</span><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.name }}</span><span style="display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; font-weight: 600; color: #A7B1C6"><span style="{{ p.rankBox }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path></svg></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.rank }}</span></span></span><button aria-label="{{ p.statusAria }}" style="{{ p.statusStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ p.statusIcon }}"></path></svg></button></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px; margin-left: 56px"><span style="flex-grow: 1; font-size: 14px; font-weight: 700; color: {{ p.examText }}">Takes exam</span><button role="switch" aria-checked="{{ p.examOn }}" aria-label="{{ p.examAria }}" onClick="{{ p.toggle }}" style="{{ p.track }}"><span style="{{ p.knob }}"></span></button></div>
<sc-if value="{{ p.hasOrders }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; margin-left: 56px; border-radius: 16px; background: #0B0E14; border: 1px solid #232B3B; overflow: hidden">
<sc-for list="{{ p.orders }}" as="o" hint-placeholder-count="1">
<sc-if value="{{ o.notFirst }}" hint-placeholder-val="{{ false }}"><div style="height: 1px; background: #232B3B; margin: 0 12px"></div></sc-if>
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px">
<a href="OrderDetails.dc.html" style="display: flex; align-items: center; gap: 8px; flex-grow: 1; min-width: 0; min-height: 44px; color: inherit"><span style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ o.title }}</span><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0"><sc-for list="{{ o.totals }}" as="t" hint-placeholder-count="1"><span style="font-size: 13.5px; font-weight: 800; white-space: nowrap">{{ t.text }}</span></sc-for></span></a>
<a href="OrdersStatusSheet.dc.html" aria-label="{{ o.aria }}" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 4px; flex-shrink: 0"><span style="{{ o.pill }}"><span style="{{ o.dot }}"></span>{{ o.status }}</span></a>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ p.showAdd }}" hint-placeholder-val="{{ false }}">
<a href="OrderCreateEventEmpty.dc.html" aria-label="{{ p.addAria }}" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 40px; margin-left: 56px; padding: 0 16px 0 12px; border-radius: 20px; background: rgba(196,174,255,0.16); color: #C4AEFF; font-size: 14px; font-weight: 800"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"></path></svg>Add order</a>
</sc-if>
</div>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 28px; background: linear-gradient(180deg, rgba(11,14,20,0) 0%, #0B0E14 38%)"><button style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: linear-gradient(135deg, #FBBF24 0%, #D97706 100%); color: #1B1203; font-size: 16px; font-weight: 800">Save</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1640}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { exam: [true, true, false, false, true] };
}
renderVals() {
const P = {
paid: { label: 'Paid', tint: '#4ADE9F', fill: 'rgba(52,211,153,0.14)', d: 'M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4' },
attending: { label: 'Attending', tint: '#FBBF24', fill: 'rgba(251,191,36,0.16)', d: 'M20 6 9 17l-5-5' },
absent: { label: 'Absent', tint: '#CBD5E1', fill: 'rgba(148,163,184,0.16)', d: 'M18 6 6 18M6 6l12 12' }
};
const S = {
placed: { label: 'Placed', tint: '#CBD5E1', fill: 'rgba(148,163,184,0.16)' },
paid: { label: 'Paid', tint: '#4ADE9F', fill: 'rgba(52,211,153,0.14)' },
processing: { label: 'Processing', tint: '#FBBF24', fill: 'rgba(251,191,36,0.16)' }
};
const list = [
{ name: 'Anna Kowalska', rank: ['Blue belt', '#3B82F6', '#FFFFFF'], st: 'paid', orders: [{ title: '3 items', totals: ['385 PLN'], st: 'placed' }] },
{ name: 'Marek Nowak', rank: ['Orange belt', '#F97316', '#1B0A02'], st: 'attending', orders: [{ title: 'Exam fee', totals: ['120 PLN'], st: 'placed' }] },
{ name: 'Zofia Wiśniewska', rank: ['Yellow belt', '#FACC15', '#1B1203'], st: 'attending', orders: [] },
{ name: 'Piotr Lewandowski', rank: null, st: 'absent', orders: [] },
{ name: 'Jan Zieliński', rank: ['Green belt', '#22C55E', '#04201D'], st: 'paid', orders: [{ title: '4 items', date: '8 Nov', totals: ['240 PLN', '35 EUR', '40 USD'], st: 'processing' }] }
];
const exam = this.state.exam;
const people = list.map((m, i) => {
const on = exam[i];
const ps = P[m.st];
return {
notFirst: i > 0,
initials: m.name.split(' ').map((w) => w[0]).join(''),
name: m.name,
rank: m.rank ? m.rank[0] : 'No rank',
rankBox: 'width: 16px; height: 16px; box-sizing: border-box; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (m.rank ? 'background: ' + m.rank[1] + '; border: 1px solid #2A3345; color: ' + m.rank[2] : 'border: 1px dashed #3A4458; color: #7D889F'),
statusAria: 'Change status, now ' + ps.label,
statusIcon: ps.d,
statusStyle: 'display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border-radius: 22px; border: 0; background: ' + ps.fill + '; color: ' + ps.tint + '; flex-shrink: 0',
examOn: on ? 'true' : 'false',
examAria: 'Takes exam, ' + m.name,
examText: on ? '#F4F6FA' : '#A7B1C6',
toggle: () => { const next = exam.slice(); next[i] = !on; this.setState({ exam: next }); },
track: 'position: relative; width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 0; flex-shrink: 0; background: ' + (on ? 'linear-gradient(135deg, #FBBF24 0%, #D97706 100%)' : '#3A4458'),
knob: 'position: absolute; top: 3px; width: 26px; height: 26px; border-radius: 13px; ' + (on ? 'right: 3px; background: #1B1203' : 'left: 3px; background: #F4F6FA'),
hasOrders: m.orders.length > 0,
orders: m.orders.map((o, j) => {
const s = S[o.st];
return {
notFirst: j > 0,
title: o.title,
totals: o.totals.map((text) => ({ text })),
status: s.label,
aria: 'Change status, ' + s.label,
pill: 'display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 9px; background: ' + s.fill + '; color: ' + s.tint + '; font-size: 11.5px; font-weight: 800; white-space: nowrap',
dot: 'width: 6px; height: 6px; border-radius: 3px; background: ' + s.tint
};
}),
showAdd: on,
addAria: 'Add order, ' + m.name
};
});
const n = exam.filter(Boolean).length;
return { people, examLine: n + (n === 1 ? ' takes the exam' : ' take the exam') };
}
}
</script>
</body>
</html>
