<div style="display: flex; align-items: center; gap: 12px; padding: 56px 20px 0"><a href="StudentsList.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3345; background: #131823; color: #F4F6FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">New student</span><span style="margin-left: auto; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(52,211,153,0.12); color: #4ADE9F; font-size: 12px; font-weight: 700"><span style="width: 7px; height: 7px; border-radius: 4px; background: #4ADE9F"></span>Synced</span></div>

<input id="sc-phone" type="tel" placeholder="600 123 456" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1px solid #2A3345; background: #0B0E14; color: #F4F6FA; font-size: 17px; font-weight: 700; outline: 0">

</div>

<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 800">Added without an app account</span><span style="font-size: 13px; font-weight: 500; line-height: 1.45; color: #A7B1C6">The student shows on the list as “No account” right away, even offline. You can mark attendance and payments for them.</span></span>
