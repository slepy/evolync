<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rank select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #0B0E14; color: #F4F6FA; font-family: 'Manrope', sans-serif">
<div style="opacity: 0.35; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 22px"><span style="font-size: 22px; font-weight: 800">Student</span><div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: #131823; border: 1px solid #232B3B"><span style="width: 64px; height: 64px; border-radius: 20px; background: rgba(148,163,184,0.16); color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">AK</span><span style="font-size: 20px; font-weight: 800">Anna Kowalska</span></div></div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; top: 200px; display: flex; flex-direction: column; gap: 14px; padding: 12px 20px 28px; border-radius: 28px 28px 0 0; background: #1A2130; border-top: 1px solid #2A3345; box-shadow: 0 -12px 40px rgba(0,0,0,0.5)">
<span style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #3A4458; flex-shrink: 0"></span>
<div style="display: flex; align-items: center; justify-content: space-between"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800">Rank</span></span><a href="StudentDetails.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #131823; border: 1px solid #2A3345; color: #F4F6FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
<div role="listbox" aria-label="Rank" style="display: flex; flex-direction: column; border-radius: 22px; background: #131823; border: 1px solid #232B3B; overflow: hidden">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<sc-if value="{{ r.notFirst }}" hint-placeholder-val="{{ false }}"><div style="height: 1px; background: #232B3B; margin: 0 16px"></div></sc-if>
<button role="option" aria-selected="{{ r.sel }}" onClick="{{ r.pick }}" style="{{ r.style }}">
<span style="{{ r.swatch }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path></svg></span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 800">{{ r.name }}</span>
<sc-if value="{{ r.selected }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FB923C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'Blue belt' };
}
renderVals() {
const ranks = [
{ name: 'No rank', color: null },
{ name: 'White belt', color: '#F4F6FA', fg: '#0B0E14' },
{ name: 'Yellow belt', color: '#FACC15', fg: '#0B0E14' },
{ name: 'Orange belt', color: '#FB923C', fg: '#0B0E14' },
{ name: 'Green belt', color: '#22C55E', fg: '#0B0E14' },
{ name: 'Blue belt', color: '#3B82F6', fg: '#FFFFFF' },
{ name: 'Brown belt', color: '#92400E', fg: '#FFFFFF' },
{ name: 'Black belt', color: '#1F2937', fg: '#FFFFFF' }
];
const rows = ranks.map((r, i) => {
const on = this.state.picked === r.name;
return {
notFirst: i > 0,
name: r.name,
sel: on ? 'true' : 'false',
selected: on,
pick: () => this.setState({ picked: r.name }),
swatch: 'width: 40px; height: 40px; box-sizing: border-box; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ' + (r.color ? 'background: ' + r.color + '; color: ' + r.fg + (r.name === 'Black belt' ? '; border: 1.5px solid rgba(255,255,255,0.28)' : '') : 'border: 1.5px dashed #3A4458; color: #7D889F'),
style: 'display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; min-height: 60px; padding: 10px 16px; border: 0; color: #F4F6FA; text-align: left; background: ' + (on ? 'rgba(251,146,60,0.08)' : 'transparent')
};
});
return { rows };
}
}
</script>
</body>
</html>
