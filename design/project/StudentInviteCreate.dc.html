<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New invite code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 706px; box-sizing: border-box; overflow: hidden; background: radial-gradient(120% 30% at 50% -6%, rgba(239,68,68,0.14), rgba(0,0,0,0) 62%), #0B0E14; color: #F4F6FA; font-family: 'Manrope', sans-serif">
<div style="display: flex; align-items: center; gap: 12px; padding: 56px 20px 0"><a href="StudentsList.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3345; background: #131823; color: #F4F6FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Invite code</span><span style="margin-left: auto; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(52,211,153,0.12); color: #4ADE9F; font-size: 12px; font-weight: 700"><span style="width: 7px; height: 7px; border-radius: 4px; background: #4ADE9F"></span>Synced</span></div>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 24px 20px 130px; height: 325px">

<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px; background: #131823; border: 1px solid #232B3B">
<span style="font-size: 16px; font-weight: 800">How it works</span>
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 12px"><span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(251,146,60,0.16); color: #FB923C; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0">{{ s.n }}</span><span style="font-size: 14px; font-weight: 600; line-height: 1.4; color: #A7B1C6">{{ s.text }}</span></span>
</sc-for>
</div>

<div role="radiogroup" aria-label="Valid for" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 18px; font-weight: 800">Valid for</span>
<sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{ o.on }}" onClick="{{ o.pick }}" style="{{ o.style }}">
<sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}"><span style="width: 24px; height: 24px; border-radius: 12px; background: linear-gradient(135deg, #FB923C 0%, #C2410C 100%); color: #1B0A02; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
<sc-if value="{{ o.unselected }}" hint-placeholder-val="{{ true }}"><span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 1.5px solid #3A4458; flex-shrink: 0"></span></sc-if>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 800">{{ o.title }}</span><span style="font-size: 12.5px; font-weight: 500; color: #A7B1C6">{{ o.hint }}</span></span>
</button>
</sc-for>
</div>



</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 28px; background: linear-gradient(180deg, rgba(11,14,20,0) 0%, #0B0E14 38%)"><button style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: linear-gradient(135deg, #FB923C 0%, #C2410C 100%); color: #1B0A02; font-size: 16px; font-weight: 800">Create</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { days: 7 };
}
renderVals() {
const opts = [
{ d: 1, title: '1 day', hint: 'Expires tomorrow, 5 Oct' },
{ d: 7, title: '7 days', hint: 'Expires 11 Oct' },
{ d: 30, title: '30 days', hint: 'Expires 3 Nov' }
];
const options = opts.map((o) => {
const on = this.state.days === o.d;
return {
on: on ? 'true' : 'false',
selected: on,
unselected: !on,
title: o.title,
hint: o.hint,
pick: () => this.setState({ days: o.d }),
style: 'display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; box-sizing: border-box; border-radius: 16px; color: #F4F6FA; text-align: left; ' + (on ? 'border: 1.5px solid #FB923C; background: rgba(251,146,60,0.08)' : 'border: 1px solid #2A3345; background: #131823')
};
});
return {
options,
steps: [
{ n: '1', text: 'Share the code with your students' },
{ n: '2', text: 'They enter it in the app to join the school' },
{ n: '3', text: 'You approve them in Requests' }
]
};
}
}
</script>
</body>
</html>
