<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archived students</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
input::placeholder{color:#7D889F}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 560px; box-sizing: border-box; overflow: hidden; background: radial-gradient(120% 30% at 50% -6%, rgba(239,68,68,0.14), rgba(0,0,0,0) 62%), #0B0E14; color: #F4F6FA; font-family: 'Manrope', sans-serif; padding: 56px 0 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 12px; padding: 0 20px">
<a href="StudentsList.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3345; background: #131823; color: #F4F6FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">Archived students</span>
<span style="margin-left: auto; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(52,211,153,0.12); color: #4ADE9F; font-size: 12px; font-weight: 700; flex-shrink: 0"><span style="width: 7px; height: 7px; border-radius: 4px; background: #4ADE9F"></span>Synced</span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.2px">{{ listTitle }}</span><span style="font-size: 13px; font-weight: 600; color: #A7B1C6">Open a student to restore them</span></span>
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 16px; background: #131823; border: 1px solid #2A3345; color: #A7B1C6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input aria-label="Search students" placeholder="Search by name or email" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #F4F6FA; font-size: 15px; font-weight: 600"></label>
<div style="display: flex; flex-direction: column; border-radius: 22px; background: #131823; border: 1px solid #232B3B; overflow: hidden">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
<sc-if value="{{ r.notFirst }}" hint-placeholder-val="{{ false }}"><div style="height: 1px; background: #232B3B; margin: 0 16px"></div></sc-if>
<a href="StudentActionsSheetArchived.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 16px; color: inherit">
<span style="{{ r.avatar }}">{{ r.initials }}<span style="{{ r.belt }}"></span></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</span><span style="font-size: 12.5px; font-weight: 500; color: #A7B1C6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.meta }}</span></span>
<span style="display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 9px; background: rgba(148,163,184,0.10); color: #7D889F; font-size: 11.5px; font-weight: 800; white-space: nowrap; flex-shrink: 0"><span style="width: 6px; height: 6px; border-radius: 3px; background: #7D889F"></span>Archived</span>
</a>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
renderVals() {
const BELT = { white: '#E5E7EB', yellow: '#FACC15', green: '#22C55E', black: '#0B0E14' };
const students = [
{ name: 'Marek Nowicki', email: 'marek.nowicki@gmail.com', belt: 'green' },
{ name: 'Tomasz Wójcik', email: 't.wojcik@gmail.com', belt: 'black' },
{ name: 'Weronika Pawlak', email: '+48 601 234 567', belt: 'yellow' }
];
const initials = (n) => n.split(' ').map((p) => p[0]).join('');
const rows = students.map((s, i) => ({
notFirst: i > 0,
initials: initials(s.name),
name: s.name,
meta: s.email,
avatar: 'position: relative; overflow: hidden; width: 44px; height: 44px; border-radius: 14px; background: rgba(148,163,184,0.16); color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; opacity: 0.55',
belt: 'position: absolute; top: -13px; right: -13px; width: 26px; height: 26px; transform: rotate(45deg); background: ' + BELT[s.belt] + (s.belt === 'black' ? '; box-shadow: 0 0 0 1px #3A4458' : '')
}));
return { rows, listTitle: students.length + ' archived' };
}
}
</script>
</body>
</html>
