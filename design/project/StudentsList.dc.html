<!doctype html>
<html lang="en">

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
input::placeholder{color:#7D889F}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 940px; box-sizing: border-box; overflow: hidden; background: radial-gradient(120% 30% at 50% -6%, rgba(239,68,68,0.14), rgba(0,0,0,0) 62%), #0B0E14; color: #F4F6FA; font-family: 'Manrope', sans-serif; padding: 56px 0 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 12px; padding: 0 20px">
<a href="School.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3345; background: #131823; color: #F4F6FA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Students</span>
<span style="margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<span style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(52,211,153,0.12); color: #4ADE9F; font-size: 12px; font-weight: 700"><span style="width: 7px; height: 7px; border-radius: 4px; background: #4ADE9F"></span>Synced</span>
<a href="StudentsArchived.dc.html" aria-label="Archived students" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A3345; background: #131823; color: #F4F6FA; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg></a>
</span>
</div>

<a href="#" aria-label="Copy invite code K7M-42Q" style="display: flex; align-items: center; gap: 14px; margin: 0 20px; padding: 14px 16px; border-radius: 22px; background: #131823; border: 1px dashed rgba(251,146,60,0.5); color: inherit">
<span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(251,146,60,0.16); color: #FB923C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 10.5px; font-weight: 800; letter-spacing: 0.8px; color: rgb(167, 177, 198)">INVITE CODE</span><span style="font-size: 19px; font-weight: 800; letter-spacing: 1.5px">K7M-42Q</span><span style="font-size: 12.5px; font-weight: 500; color: rgb(167, 177, 198)">Expires 18 Oct&nbsp;</span></span>
<span style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(251,146,60,0.16); color: #FB923C; font-size: 13px; font-weight: 800; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>Copy</span>
</a><div role="tablist" aria-label="View" style="display: flex; gap: 4px; margin: 0 20px; padding: 4px; border-radius: 24px; background: #131823; border: 1px solid #232B3B">
<button role="tab" aria-selected="{{ tabStudents.on }}" onClick="{{ tabStudents.pick }}" style="{{ tabStudents.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Students</button>
<button role="tab" aria-selected="{{ tabRequests.on }}" onClick="{{ tabRequests.pick }}" style="{{ tabRequests.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>Requests<sc-if value="{{ hasRequests }}" hint-placeholder-val="{{ true }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #FF5A5A; color: #fff; font-size: 12px; font-weight: 800">{{ requestCount }}</span></sc-if></button>
</div>

<sc-if value="{{ isStudents }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 0">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.2px">{{ listTitle }}</span>
<span style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<a href="StudentInviteCreate.dc.html" aria-label="New invite code" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(251,146,60,0.16); color: #FB923C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"></path></svg></a>
<a href="StudentCreate.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; background: rgba(251,146,60,0.16); color: #FB923C; font-size: 14px; font-weight: 800"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"></path></svg>Add new</a>
</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; box-sizing: border-box; border-radius: 16px; background: #131823; border: 1px solid #2A3345; color: #A7B1C6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input aria-label="Search students" placeholder="Search by name or email" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #F4F6FA; font-size: 15px; font-weight: 600"></label>
<div style="display: flex; flex-direction: column; border-radius: 22px; background: #131823; border: 1px solid #232B3B; overflow: hidden">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<sc-if value="{{ r.notFirst }}" hint-placeholder-val="{{ false }}"><div style="height: 1px; background: #232B3B; margin: 0 16px"></div></sc-if>
<a href="StudentDetails.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 16px; color: inherit">
<span style="{{ r.avatar }}">{{ r.initials }}<span style="{{ r.belt }}"></span></span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</span><span style="font-size: 12.5px; font-weight: 500; color: #A7B1C6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.meta }}</span></span>
<sc-if value="{{ r.showPill }}" hint-placeholder-val="{{ false }}"><span style="{{ r.pill }}"><span style="{{ r.dot }}"></span>{{ r.status }}</span></sc-if>
</a>
</sc-for>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding: 20px 16px; color: #A7B1C6; font-size: 14px; font-weight: 600">No students yet.</div></sc-if>
</div>
</div>

</div>
</sc-if>

<sc-if value="{{ isRequests }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 8px 20px 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.2px">Waiting for approval</span><span style="font-size: 13px; font-weight: 600; color: #A7B1C6">Joined with an invite code</span></span>
<div style="display: flex; flex-direction: column; border-radius: 22px; background: #131823; border: 1px solid #232B3B; overflow: hidden">
<sc-for list="{{ requests }}" as="q" hint-placeholder-count="3">
<sc-if value="{{ q.notFirst }}" hint-placeholder-val="{{ false }}"><div style="height: 1px; background: #232B3B; margin: 0 16px"></div></sc-if>
<div style="display: flex; align-items: center; gap: 12px; min-height: 72px; box-sizing: border-box; padding: 12px 16px">
<span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(148,163,184,0.16); color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0">{{ q.initials }}</span>
<span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ q.name }}</span><span style="font-size: 12.5px; font-weight: 500; color: #A7B1C6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ q.meta }}</span></span>
<button aria-label="{{ q.rejectLabel }}" onClick="{{ q.resolve }}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,90,90,0.4); background: rgba(255,90,90,0.10); color: #FF8A8A; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
<button aria-label="{{ q.approveLabel }}" onClick="{{ q.resolve }}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: linear-gradient(135deg, #FB923C 0%, #C2410C 100%); color: #1B0A02; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></button>
</div>
</sc-for>
<sc-if value="{{ noRequests }}" hint-placeholder-val="{{ false }}"><div style="padding: 20px 16px; color: #A7B1C6; font-size: 14px; font-weight: 600">No pending requests.</div></sc-if>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'students', resolved: [] };
}
renderVals() {
const S = {
active: { label: 'Active', tint: '#4ADE9F', fill: 'rgba(52,211,153,0.14)' },
offline: { label: 'No account', tint: '#CBD5E1', fill: 'rgba(148,163,184,0.16)' },
archived: { label: 'Archived', tint: '#7D889F', fill: 'rgba(148,163,184,0.10)' }
};
const BELT = { white: '#E5E7EB', yellow: '#FACC15', orange: '#FB923C', green: '#22C55E', blue: '#3B82F6', brown: '#A16207', black: '#0B0E14' };
const students = [
{ name: 'Anna Kowalska', email: 'anna.kowalska@gmail.com', belt: 'blue', rank: 'Blue belt', st: 'active' },
{ name: 'Adam Krawczyk', email: 'a.krawczyk@wp.pl', belt: 'green', rank: 'Green belt', st: 'active' },
{ name: 'Zofia Wiśniewska', email: 'zofia.w@onet.pl', belt: 'yellow', rank: 'Yellow belt', st: 'active' },
{ name: 'Piotr Lewandowski', email: 'piotr.lew@gmail.com', belt: 'brown', rank: 'Brown belt', st: 'active' },
{ name: 'Katarzyna Dąbrowska', email: 'kasia.dab@gmail.com', belt: 'white', rank: 'White belt', st: 'active' },
{ name: 'Jan Zieliński', email: 'jan.zielinski@gmail.com', belt: 'orange', rank: 'Orange belt', st: 'offline' },
{ name: 'Ola Szymańska', email: 'ola.szymanska@wp.pl', belt: 'white', rank: 'White belt', st: 'offline' },
{ name: 'Tomasz Wójcik', email: 't.wojcik@gmail.com', belt: 'black', rank: 'Black belt', st: 'archived' }
];
const allRequests = [
{ name: 'Michał Kaczmarek', email: 'michal.k@gmail.com', when: '2 h ago' },
{ name: 'Ewa Kamińska', email: 'ewa.kaminska@wp.pl', when: 'Yesterday' },
{ name: 'Urszula Mazur', email: 'ula.mazur@gmail.com', when: '3 Oct' }
];
const { tab, resolved } = this.state;
const tabStyle = (on) => 'flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border-radius: 20px; border: 0; font-size: 14px; font-weight: 800; ' + (on ? 'background: rgba(251,146,60,0.16); color: #FB923C' : 'background: transparent; color: #A7B1C6');
const list = students.filter((s) => s.st !== 'archived');
const initials = (n) => n.split(' ').map((p) => p[0]).join('');
const rows = list.map((s, i) => {
const st = S[s.st];
const ring = BELT[s.belt];
return {
notFirst: i > 0,
initials: initials(s.name),
name: s.name,
meta: s.email,
avatar: 'position: relative; overflow: hidden; width: 44px; height: 44px; border-radius: 14px; background: rgba(148,163,184,0.16); color: #CBD5E1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0' + (s.st === 'archived' ? '; opacity: 0.55' : ''),
belt: 'position: absolute; top: -13px; right: -13px; width: 26px; height: 26px; transform: rotate(45deg); background: ' + ring + (s.belt === 'black' ? '; box-shadow: 0 0 0 1px #3A4458' : ''),
showPill: s.st !== 'active',
status: st.label,
pill: 'display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 9px; background: ' + st.fill + '; color: ' + st.tint + '; font-size: 11.5px; font-weight: 800; white-space: nowrap; flex-shrink: 0',
dot: 'width: 6px; height: 6px; border-radius: 3px; background: ' + st.tint
};
});
const pending = allRequests.filter((r) => !resolved.includes(r.name));
const requests = pending.map((r, i) => ({
notFirst: i > 0,
initials: initials(r.name),
name: r.name,
meta: r.email + ' · ' + r.when,
rejectLabel: 'Reject ' + r.name,
approveLabel: 'Approve ' + r.name,
resolve: () => this.setState({ resolved: resolved.concat(r.name) })
}));
return {
isStudents: tab === 'students',
isRequests: tab === 'requests',
tabStudents: { on: tab === 'students' ? 'true' : 'false', pick: () => this.setState({ tab: 'students' }), style: tabStyle(tab === 'students') },
tabRequests: { on: tab === 'requests' ? 'true' : 'false', pick: () => this.setState({ tab: 'requests' }), style: tabStyle(tab === 'requests') },
hasRequests: pending.length > 0,
requestCount: pending.length,
rows,
isEmpty: rows.length === 0,
listTitle: list.length + ' students',
requests,
noRequests: pending.length === 0
};
}
}
</script>
</body>
</html>
